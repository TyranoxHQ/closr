name: Bug Report
description: Report a bug in Closr (Windows Direct or Microsoft Store)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** attach private files, device keys (`device_key.enc`), `trust_store.json`, or personal data.
  - type: dropdown
    id: distribution
    attributes:
      label: Windows Distribution
      options:
        - Microsoft Store (MSIX)
        - Direct Installer (Closr-Setup)
        - Portable ZIP
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Closr Version
      placeholder: "e.g. 0.3.1 (Direct) / 1.3.14.0 (Store)"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Windows / OS Version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the issue and steps to reproduce it.
    validations:
      required: true
